<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="circle-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.6">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Glow blob -->
  <ellipse cx="600" cy="315" rx="320" ry="200" fill="url(#circle-grad)"/>

  <!-- Mic icon ring -->
  <circle cx="130" cy="315" r="56" fill="none" stroke="#0d9488" stroke-width="1.5" opacity="0.25"/>
  <circle cx="130" cy="315" r="40" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5" opacity="0.5"/>
  <!-- Mic body -->
  <rect x="122" y="296" width="16" height="26" rx="8" fill="#0d9488"/>
  <!-- Mic stand -->
  <path d="M 122 320 Q 122 334 130 334 Q 138 334 138 320" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="334" x2="130" y2="340" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
  <line x1="124" y1="340" x2="136" y2="340" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>

  <!-- Waveform decoration (right side) -->
  <g opacity="0.12" stroke="#0d9488" stroke-width="2" stroke-linecap="round">
    <line x1="950" y1="255" x2="950" y2="375"/>
    <line x1="970" y1="280" x2="970" y2="350"/>
    <line x1="990" y1="265" x2="990" y2="365"/>
    <line x1="1010" y1="290" x2="1010" y2="340"/>
    <line x1="1030" y1="270" x2="1030" y2="360"/>
    <line x1="1050" y1="285" x2="1050" y2="345"/>
    <line x1="1070" y1="275" x2="1070" y2="355"/>
  </g>

  <!-- Brand badge -->
  <rect x="195" y="198" width="110" height="28" rx="14" fill="#0d9488" opacity="0.12"/>
  <text x="250" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0d9488" text-anchor="middle" letter-spacing="2">FLUENT AI</text>

  <!-- Main wordmark -->
  <text x="195" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" letter-spacing="-4" fill="url(#teal-grad)">Fluent</text>

  <!-- Tagline -->
  <text x="195" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#475569">Clone your voice in 30 seconds.</text>

  <!-- Stats row -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Stat 1 -->
    <text x="195" y="440" font-size="22" font-weight="700" fill="#0f172a">99.2%</text>
    <text x="195" y="462" font-size="13" fill="#64748b">Voice match accuracy</text>
    <!-- Divider -->
    <line x1="330" y1="430" x2="330" y2="465" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Stat 2 -->
    <text x="348" y="440" font-size="22" font-weight="700" fill="#0f172a">~0.8s</text>
    <text x="348" y="462" font-size="13" fill="#64748b">Generation time</text>
    <!-- Divider -->
    <line x1="483" y1="430" x2="483" y2="465" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Stat 3 -->
    <text x="501" y="440" font-size="22" font-weight="700" fill="#0f172a">30s</text>
    <text x="501" y="462" font-size="13" fill="#64748b">To clone your voice</text>
  </g>

  <!-- CTA pill -->
  <rect x="195" y="490" width="148" height="40" rx="20" fill="#0d9488"/>
  <text x="269" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Join the Beta →</text>

  <!-- Bottom border accent -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#teal-grad)" opacity="0.6"/>
</svg>

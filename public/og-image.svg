<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="circle-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#e2e8f0" stroke-width="1" opacity="0.6">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Glow blob -->
  <ellipse cx="600" cy="315" rx="320" ry="200" fill="url(#circle-grad)"/>

  <!-- Logo icon (speech bubble + waveform) -->
  <rect x="86" y="275" width="88" height="64" rx="12" fill="#0d9488" opacity="0.12" stroke="#0d9488" stroke-width="1.5"/>
  <polygon points="110,339 126,355 126,339" fill="#0d9488" opacity="0.12"/>
  <rect x="102" y="289" width="6" height="18" rx="3" fill="#0d9488"/>
  <rect x="114" y="283" width="6" height="30" rx="3" fill="#0d9488"/>
  <rect x="126" y="287" width="6" height="22" rx="3" fill="#0d9488"/>
  <rect x="138" y="285" width="6" height="26" rx="3" fill="#0d9488"/>
  <rect x="150" y="291" width="6" height="14" rx="3" fill="#0d9488"/>

  <!-- Waveform decoration (right side) -->
  <g opacity="0.12" stroke="#0d9488" stroke-width="2" stroke-linecap="round">
    <line x1="950" y1="255" x2="950" y2="375"/>
    <line x1="970" y1="280" x2="970" y2="350"/>
    <line x1="990" y1="265" x2="990" y2="365"/>
    <line x1="1010" y1="290" x2="1010" y2="340"/>
    <line x1="1030" y1="270" x2="1030" y2="360"/>
    <line x1="1050" y1="285" x2="1050" y2="345"/>
    <line x1="1070" y1="275" x2="1070" y2="355"/>
  </g>

  <!-- Brand badge -->
  <rect x="195" y="198" width="90" height="28" rx="14" fill="#0d9488" opacity="0.12"/>
  <text x="240" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0d9488" text-anchor="middle" letter-spacing="2">ALOUD</text>

  <!-- Main wordmark -->
  <text x="195" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="800" letter-spacing="-4" fill="url(#teal-grad)">Aloud</text>

  <!-- Tagline -->
  <text x="195" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#475569">Make any call. Without speaking.</text>

  <!-- CTA pill -->
  <rect x="195" y="430" width="148" height="40" rx="20" fill="#0d9488"/>
  <text x="269" y="455" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Join the Beta →</text>

  <!-- Bottom border accent -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#teal-grad)" opacity="0.6"/>
</svg>
